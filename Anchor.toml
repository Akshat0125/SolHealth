[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
solhealth = "52sv1bDkPFyi8mwVG2eYLYPXPmr6n1oTBmmDLsjC9Hhq"

[programs.devnet]
solhealth = "52sv1bDkPFyi8mwVG2eYLYPXPmr6n1oTBmmDLsjC9Hhq"

[provider]
# To switch between networks:
# Devnet: cluster = "devnet" (solana config set --url https://api.devnet.solana.com)
# Localnet: cluster = "localnet" (solana config set --url http://127.0.0.1:8899)
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "node -e 'const fs=require(\"fs\"); const p=\"node_modules/yargs/package.json\"; if(fs.existsSync(p)){const j=JSON.parse(fs.readFileSync(p,\"utf8\"));j.type=\"commonjs\";fs.writeFileSync(p,JSON.stringify(j,null,2));}' && yarn run ts-mocha -p ./tsconfig.json -t 1000000 'tests/**/*.ts'"

[hooks]

[test]
[test.validator]
url = "http://127.0.0.1:8899"
